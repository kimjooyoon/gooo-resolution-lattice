name: Resolution lattice conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resolution-lattice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}

      - name: Install Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false

      - name: Validate Go source in CI
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Go version: $(go env GOVERSION)"
          test "$(go env GOVERSION)" = "go1.27.0"
          before=$(git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}')
          gofmt_files=$(gofmt -l cmd internal)
          echo "gofmt files: ${gofmt_files:-none}"
          if test -n "$gofmt_files"; then
            gofmt -d cmd internal
          fi
          test -z "$gofmt_files"
          go vet ./...
          test_start=$(date +%s%N)
          go test -json ./... > "$RUNNER_TEMP/go-test.json"
          test_end=$(date +%s%N)
          go_test_cases=$(jq -s '[.[] | select(.Action == "pass" and .Test != null)] | length' "$RUNNER_TEMP/go-test.json")
          test "$go_test_cases" -ge 1
          build_start=$(date +%s%N)
          go build -trimpath -o "$RUNNER_TEMP/gooo-lattice" ./cmd/gooo-lattice
          build_end=$(date +%s%N)
          after=$(git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}')
          test "$before" = "$after"
          echo "$go_test_cases" > "$RUNNER_TEMP/go-test-cases"
          echo "$(( (test_end - test_start) / 1000000 ))" > "$RUNNER_TEMP/test-wall-ms"
          echo "$(( (build_end - build_start) / 1000000 ))" > "$RUNNER_TEMP/build-wall-ms"

      - name: Generate semantic IR and resolve every conformance case
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/lattice-artifact"
          source="examples/resolution-lattice/main.gooo"
          denominator="contracts/resolution-lattice-denominator-v1.json"
          mkdir -p "$artifact/cases" "$artifact/receipts"
          "$RUNNER_TEMP/gooo-lattice" compile --source "$source" --contract "$denominator" --output "$artifact/semantic-ir.json" > "$RUNNER_TEMP/semantic-ir.stdout.json"
          before=$(git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}')
          start=$(date +%s%N)
          : > "$RUNNER_TEMP/peak-rss"
          for case_id in normal unknown refuted fixed-point privilege-escalation malformed improvement-unknown; do
            output="$RUNNER_TEMP/lattice-output-$case_id"
            mkdir -p "$output"
            if test "$case_id" = "normal"; then
              /usr/bin/time -f '%M' -o "$RUNNER_TEMP/peak-rss" \
                "$RUNNER_TEMP/gooo-lattice" resolve \
                --input "fixtures/cases/$case_id.json" --output-dir "$output" \
                --source "$source" --contract "$denominator" --ir "$artifact/semantic-ir.json" \
                > "$RUNNER_TEMP/$case_id.stdout"
            else
              "$RUNNER_TEMP/gooo-lattice" resolve \
                --input "fixtures/cases/$case_id.json" --output-dir "$output" \
                --source "$source" --contract "$denominator" --ir "$artifact/semantic-ir.json" \
                > "$RUNNER_TEMP/$case_id.stdout"
            fi
            cp "$output/report.json" "$artifact/cases/$case_id.json"
            cp "$output/receipts.json" "$artifact/receipts/$case_id.json"
          done
          end=$(date +%s%N)
          after=$(git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}')
          test "$before" = "$after"
          test -s "$RUNNER_TEMP/peak-rss"
          echo "$(( (end - start) / 1000000 ))" > "$RUNNER_TEMP/conformance-wall-ms"
          echo "$(cat "$RUNNER_TEMP/peak-rss")" > "$RUNNER_TEMP/peak-rss-kib"
          gooo_source_digest="sha256:$(sha256sum "$source" | awk '{print $1}')"
          contract_digest="sha256:$(sha256sum "$denominator" | awk '{print $1}')"
          jq -S -n \
            --arg go_version "$(go env GOVERSION)" \
            --arg source_digest "$gooo_source_digest" \
            --arg contract_digest "$contract_digest" \
            --argjson build_wall_ms "$(cat "$RUNNER_TEMP/build-wall-ms")" \
            --argjson test_wall_ms "$(cat "$RUNNER_TEMP/test-wall-ms")" \
            --argjson conformance_wall_ms "$(cat "$RUNNER_TEMP/conformance-wall-ms")" \
            --argjson peak_rss_kib "$(cat "$RUNNER_TEMP/peak-rss-kib")" \
            --argjson go_test_cases "$(cat "$RUNNER_TEMP/go-test-cases")" \
            '{schema:"gooo/resolution-lattice/runtime/v1",go_version:$go_version,
              source_digest:$source_digest,contract_digest:$contract_digest,
              build_wall_ms:$build_wall_ms,test_wall_ms:$test_wall_ms,
              conformance_wall_ms:$conformance_wall_ms,peak_rss_kib:$peak_rss_kib,
              repository_writes:0,local_tests_run:0,
              test_counts:{executed:$go_test_cases,reused:0,skipped:0}}' \
            > "$artifact/runtime.json"

      - name: Evaluate fixed denominator and publish human artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact="$RUNNER_TEMP/lattice-artifact"
          bash scripts/evaluate.sh \
            "$artifact" \
            examples/resolution-lattice/main.gooo \
            "$artifact/semantic-ir.json" \
            contracts/resolution-lattice-denominator-v1.json \
            "$artifact/runtime.json" \
            "$(cat "$RUNNER_TEMP/go-test-cases")" \
            "$SUBJECT_SHA" \
            "$artifact/ci-report.json" \
            "$artifact/ci-report.md"
          jq -e '
            .decision == "RESOLUTION_LATTICE_CONFORMANCE_CLOSED" and
            .summary.numerator == 12 and .summary.denominator == 12 and
            .case_summary.numerator == 7 and .case_summary.denominator == 7 and
            .inventory.root_readme_excluded == true and
            .inventory.physical_lines_include_blank_and_comments == true and
            .artifacts.repository_writes == 0 and .tests.local_tests_run == 0 and
            ([.metrics[] | select(.numerator == 1 and .denominator == 1)] | length) == 12 and
            (all(.metrics[]; .activity != null and .source_digest != null and .ir_node != null and .generated_artifact != null and .evaluator != null))
          ' "$artifact/ci-report.json" >/dev/null
          cat "$artifact/ci-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload conformance evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: gooo-resolution-lattice-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/lattice-artifact
          if-no-files-found: error

      - name: Record artifact identity
        shell: bash
        run: |
          echo "- artifact id: `${{ steps.evidence.outputs.artifact-id }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- artifact digest: `${{ steps.evidence.outputs.artifact-digest }}`" >> "$GITHUB_STEP_SUMMARY"
