name: Immutable resolution lattice release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: '1.27.0'
    steps:
      - name: Checkout annotated tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify annotated immutable tag
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git cat-file -t "$GITHUB_REF_NAME^{tag}")" = tag
          test "$(git rev-parse "$GITHUB_REF_NAME^{}")" = "$GITHUB_SHA"

      - name: Install Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build immutable source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="gooo-resolution-lattice-${GITHUB_REF_NAME#v}.tar.gz"
          git archive --format=tar.gz --prefix="gooo-resolution-lattice-${GITHUB_REF_NAME#v}/" -o "$archive" "$GITHUB_SHA"
          sha256sum "$archive" > SHA256SUMS
          jq -S -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg go_version "$(go env GOVERSION)" \
            '{schema:"gooo/resolution-lattice/release-manifest/v1",tag:$tag,commit:$commit,go_version:$go_version,immutable:true}' \
            > release-manifest.json

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="gooo-resolution-lattice-${GITHUB_REF_NAME#v}.tar.gz"
          gh release create "$GITHUB_REF_NAME" "$archive" SHA256SUMS release-manifest.json \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Immutable Gooo resolution-lattice source release."
