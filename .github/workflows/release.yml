name: Immutable resolution lattice release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing annotated release tag to publish'
        required: true
        type: string
      release_commit:
        description: 'Commit peeled from the annotated release tag'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: '1.27.0'
    steps:
      - name: Checkout annotated tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || github.sha }}

      - name: Verify annotated immutable tag
        shell: bash
        run: |
          set -Eeuo pipefail
          release_tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          release_commit="${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || github.sha }}"
          test "$(git cat-file -t "$release_tag")" = tag
          test "$(git rev-parse "$release_tag^{}")" = "$release_commit"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"

      - name: Install Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build immutable source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="gooo-resolution-lattice-${RELEASE_TAG#v}.tar.gz"
          git archive --format=tar.gz --prefix="gooo-resolution-lattice-${RELEASE_TAG#v}/" -o "$archive" "$RELEASE_COMMIT"
          sha256sum "$archive" > SHA256SUMS
          jq -S -n \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            --arg go_version "$(go env GOVERSION)" \
            '{schema:"gooo/resolution-lattice/release-manifest/v1",tag:$tag,commit:$commit,go_version:$go_version,immutable:true}' \
            > release-manifest.json

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="gooo-resolution-lattice-${RELEASE_TAG#v}.tar.gz"
          gh release create "$RELEASE_TAG" "$archive" SHA256SUMS release-manifest.json \
            --verify-tag --title "$RELEASE_TAG" \
            --notes "Immutable Gooo resolution-lattice source release."
